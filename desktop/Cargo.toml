[package]
name = "kafkalens-desktop"
version = "0.1.0"
edition = "2021"
description = "Kafkalens for Windows and Linux (Slint UI over kafkalens-core)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maiaxi/kafkalens"
publish = false

[[bin]]
name = "kafkalens"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
kafkalens-core = { path = "../core" }
# Passwords go to the system credential store: Windows Credential Manager,
# the Secret Service on Linux, the Keychain on macOS.
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used under the Slint Royalty-free Desktop license, which asks for the
# "Made with Slint" attribution shown in the app.
slint = "1.18"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.18"
