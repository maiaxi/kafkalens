[env]
# Must match `platforms` in macos/Package.swift, or the C dependencies
# (librdkafka, OpenSSL) get built for the host OS version instead. Set here
# rather than in a script so `cargo test` and the app build agree and do not
# keep rebuilding librdkafka.
MACOSX_DEPLOYMENT_TARGET = "14.0"

# Windows: link the C runtime statically, so the .exe runs without the
# Visual C++ Redistributable (a portable, single-file app).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
