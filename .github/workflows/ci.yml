name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux, live brokers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Start brokers
        run: |
          docker compose --profile acl up -d
          scripts/dev-acl-setup.sh
          until docker exec kafkalens-kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 --list >/dev/null 2>&1; do
            sleep 2
          done

      - name: Seed sample data
        run: cargo run -p kafkalens-core --example seed

      - name: Test
        run: cargo test -p kafkalens-core
        env:
          KAFKALENS_BOOTSTRAP: localhost:9092
          KAFKALENS_ACL_BOOTSTRAP: localhost:9094

  macos:
    name: macOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build core and bindings
        run: scripts/build-core.sh debug

      - name: Build app
        working-directory: macos
        run: swift build

  desktop:
    name: Desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: kafkalens-windows-x64
            binary: target/release/kafkalens.exe
          - name: Linux
            os: ubuntu-24.04
            artifact: kafkalens-linux-x64
            binary: target/release/kafkalens
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Slint's winit backend links against fontconfig and xkbcommon.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # The vendored OpenSSL build uses NASM for its assembly on Windows.
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nasm --no-progress -y
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      - name: Test
        run: cargo test -p kafkalens-desktop

      - name: Build
        run: cargo build --release -p kafkalens-desktop

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
