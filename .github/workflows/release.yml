name: Release

# Pushing a tag such as v0.1.0 builds the app for macOS (universal), Windows
# (portable .exe) and Linux, and creates a *draft* GitHub release with all of
# them, to review and publish by hand. Running it by hand (workflow_dispatch)
# does the same builds and uploads them as workflow artifacts instead, to
# check a release before tagging.
#
# The macOS app is signed with the certificate in MACOS_CERTIFICATE_P12 (a
# self-signed one today, see docs/RELEASING.md) and notarized only when Apple
# credentials exist. Without any secrets it is ad-hoc signed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version and check it matches the tag
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${version} in Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal app
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "KAFKALENS_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: scripts/bundle-app.sh --universal

      - name: Notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/Kafkalens.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Kafkalens.app

      - name: Package
        run: |
          mkdir -p release
          asset="Kafkalens-${VERSION}-macos-universal.zip"
          ditto -c -k --keepParent dist/Kafkalens.app "release/$asset"
          (cd release && shasum -a 256 "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release/

  windows:
    name: Windows portable app
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The vendored OpenSSL build uses NASM for its assembly on Windows.
      # (Installed with Chocolatey: the setup-nasm action still runs on Node 20.)
      - name: Install NASM
        shell: bash
        run: |
          choco install nasm --no-progress -y
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --release -p kafkalens-desktop

      # A single self-contained .exe (static C runtime), shipped as is.
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          asset="Kafkalens-${VERSION}-windows-x64.exe"
          cp target/release/kafkalens.exe "release/$asset"
          (cd release && sha256sum "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/

  linux:
    name: Linux app
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release -p kafkalens-desktop

      - name: Package
        run: |
          name="Kafkalens-${VERSION}-linux-x64"
          mkdir -p "dist/$name" release
          cp target/release/kafkalens "dist/$name/"
          cp desktop/assets/kafkalens.png desktop/assets/kafkalens.desktop "dist/$name/"
          cp desktop/assets/INSTALL-linux.txt "dist/$name/INSTALL.txt"
          tar -czf "release/$name.tar.gz" -C dist "$name"
          (cd release && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release/

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$HAS_NOTARIZATION" == "true" ]]; then
            macos_note="Signed with Developer ID and notarized by Apple."
          else
            macos_note="Not notarized by Apple: macOS blocks the first launch. Open System Settings → Privacy & Security and click *Open Anyway*, or run \`xattr -dr com.apple.quarantine /Applications/Kafkalens.app\`."
          fi
          cat > notes.md <<NOTES
          ### Downloads
          - **macOS** (Apple Silicon and Intel, macOS 14 or later): \`Kafkalens-${VERSION}-macos-universal.zip\`. Unzip and move Kafkalens.app to Applications. ${macos_note}
          - **Windows** (x64): \`Kafkalens-${VERSION}-windows-x64.exe\`, a portable app with nothing to install. Not code-signed: SmartScreen shows a warning the first time; click *More info* → *Run anyway*.
          - **Linux** (x64): \`Kafkalens-${VERSION}-linux-x64.tar.gz\`. Extract and run \`./kafkalens\`; INSTALL.txt explains adding it to the applications menu.

          Each file has a \`.sha256\` checksum next to it.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft --generate-notes \
            --title "Kafkalens ${VERSION}" \
            --notes-file notes.md
